<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEB-ROULPIANO</title>
<style>
  :root { --bg:#0e1120; --panel:#171b30; --line:#2a3050; --text:#e8ebf7; --muted:#8d94b3;
          --R:#ff9a2e; --L:#3b9cff; --accent:#5b7cff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
              font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:8px 12px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
  .grp { display:flex; align-items:center; gap:8px; }
  button, .btn { background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 13px;
                 font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover, .btn:hover { background:#2f3760; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#6f8bff; }
  input[type=file] { display:none; }
  input[type=range] { accent-color:var(--accent); }
  input[type=number] { width:4.8em; background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; font-variant-numeric:tabular-nums; }
  select { background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; }
  label { color:var(--muted); }
  #speed { width:190px; }
  #speedVal { display:inline-block; min-width:3.4em; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  .legend { color:var(--muted); font-size:13px; }
  #title { font-weight:600; max-width:34ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #status { color:var(--muted); font-size:13px; margin-left:auto; }
  #status.err { color:#ff7b7b; }
  #progress { flex:1; min-width:160px; }
  #info { color:var(--muted); font-variant-numeric:tabular-nums; min-width:21ch; text-align:right; }
  .tip { position:relative; }
  .tiptext { display:none; position:absolute; top:calc(100% + 8px); left:0; width:max-content; max-width:min(520px, 90vw); z-index:20;
             background:#0b0e1c; color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:8px 12px; font-size:13px; line-height:1.4;
             box-shadow:0 6px 20px rgba(0,0,0,.5); pointer-events:none; }
  .tip:hover .tiptext, .tip:focus-within .tiptext { display:block; }
  footer { background:var(--panel); border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:12px; letter-spacing:.12em; padding:6px 12px; }
  footer a { color:#a9b6ff; text-decoration:underline; text-underline-offset:3px; }
  footer a:hover { color:#fff; }
  main { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #fpop { position:absolute; z-index:6; display:none; align-items:center; gap:5px; background:#0b0e1c; border:1px solid var(--accent); border-radius:10px; padding:6px 8px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #fpop .sep { width:1px; align-self:stretch; background:var(--line); margin:0 3px; }
  #fpop button { padding:4px 10px; min-width:30px; }
  #gpop { position:absolute; z-index:6; display:none; align-items:center; gap:8px; background:#0b0e1c; border:1px solid var(--accent); border-radius:10px; padding:6px 10px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #gpop .sep { width:1px; align-self:stretch; background:var(--line); }
  #gpop button { padding:4px 12px; }
  #fpop #nums { display:none; gap:5px; }
  #fpop #rake { display:flex; line-height:0; } #fpop .fk { cursor:pointer; } #fpop .fk:hover circle { stroke:#fff; }
  #fpop button.on { background:var(--accent); border-color:var(--accent); font-weight:700; }
  .seg { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#1e2340; }
  .seg .seglab { padding:0 8px; color:var(--muted); }
  .seg button { border:0; border-left:1px solid var(--line); border-radius:0; background:transparent; padding:7px 11px; }
  .seg button.pressed { background:var(--accent); font-weight:600; }
  button.pressed { background:var(--accent); border-color:var(--accent); }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(91,124,255,.25);
          border:3px dashed var(--accent); font-size:22px; z-index:5; pointer-events:none; }
  body.dragging #drop { display:flex; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="core.js"></script>
</head>
<body>
<header>
  <div class="row">
    <label class="btn" for="file">📂 Ouvrir un fichier…</label>
    <input id="file" type="file" accept=".mid,.midi,.musicxml,.xml,.mxl">
    <button id="demo" title="Charger le morceau d'exemple intégré">Exemple</button>
    <div class="grp tip">
      <button id="export">🎬 Export vidéo</button>
      <select id="xres" title="Résolution de la vidéo"><option value="1280">720p</option><option value="1920">1080p</option></select>
      <span class="tiptext" role="tooltip">Garder l'onglet visible pendant l'export, sinon le navigateur ralentit l'enregistrement. L'export est impossible à la vitesse 0.</span>
    </div>
    <div class="grp">
      <button id="rew" title="Retour au début (Début)">⏮ Début</button>
      <button id="play" class="primary" title="Lecture (Espace)">▶ Lecture</button>
      <button id="stop" title="Pause : arrête à la position courante (Espace)">⏸ Pause</button>
    </div>
    <div class="grp">
      <label for="speed">Vitesse</label>
      <input id="speed" title="Vitesse de lecture (0 à 3)" type="range" min="0" max="3" step="0.05" value="1">
      <span id="speedVal">×1,00</span>
      <button id="speed1" title="Remettre la vitesse à 1">1×</button>
    </div>
    <div class="grp">
      <label for="tempo">Tempo ♩ =</label>
      <input id="tempo" type="number" min="20" max="300" step="1" disabled title="Tempo de départ (noires par minute). Par défaut : celui du fichier ; modifiable.">
      <button id="tempoReset" title="Revenir au tempo du fichier">↺</button>
    </div>
    <div class="grp">
      <div id="fingMode" class="seg" role="group" aria-label="Affichage des doigtés" title="Pour saisir un doigté : cliquer sur une note."><span class="seglab">🖐</span><button data-m="off">Masquer les doigtés</button><button data-m="simple">Doigtés simples</button><button data-m="illus">Doigtés illustrés</button></div>
      <button id="fingExp" title="Exporter les doigtés de ce morceau dans un fichier">⤓</button>
      <button id="fingImp" title="Importer des doigtés depuis un fichier (remplace les actuels)">⤒</button>
      <input id="fingFile" type="file" accept=".json,application/json">
    </div>
    <div class="grp">
      <label for="sync">Synchro</label>
      <input id="sync" type="number" min="-300" max="1000" step="10" value="0" title="Décalage son/image en millisecondes. Le navigateur compense déjà la latence audio ; si le son vous semble encore en retard sur l'image, augmentez cette valeur (l'image est retardée) ; s'il est en avance, diminuez-la.">
      <span class="legend">ms</span>
    </div>
    <div class="grp">
      <label for="vis">Mesures visibles</label>
      <select id="vis"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
    </div>
    <span class="legend" title="La couleur suit la main du doigté (modifiable note par note) : orange = main droite, bleu = main gauche"><span class="sw" style="background:var(--R)"></span>M.D.
      <span class="sw" style="background:var(--L);margin-left:10px"></span>M.G.</span>
  </div>
  <div class="row">
    <span id="title">Aucun morceau</span>
    <input id="progress" title="Position dans le morceau" type="range" min="0" max="1" step="0.001" value="0" disabled>
    <span id="info">—</span>
    <span id="status"></span>
  </div>
</header>
<main>
  <canvas id="cv"></canvas>
  <div id="gpop"><span id="gcount"></span><span class="sep"></span><button data-gh="R" title="Affecter ces notes à la main droite">M.D.</button><button data-gh="L" title="Affecter ces notes à la main gauche">M.G.</button><button id="gcancel" title="Annuler la sélection (Échap)">✕</button></div>
  <div id="fpop"><button data-h="R" title="Main droite (touche D)">M.D.</button><button data-h="L" title="Main gauche (touche G)">M.G.</button><span class="sep"></span><span id="rake"></span><span id="nums"><button data-f="1">1</button><button data-f="2">2</button><button data-f="3">3</button><button data-f="4">4</button><button data-f="5">5</button></span><button data-f="0" title="Effacer le doigté">✕</button></div>
  <div id="drop">Déposez un fichier .mid / .musicxml / .mxl</div>
</main>
<footer>SEB-ROULPIANO · Octobre 2026 · <a href="MODE-D-EMPLOI.html" target="_blank" rel="noopener">Mode d'emploi</a></footer>

let FIRST = 21, LAST = 108; // étendue affichée : tout le piano tant qu'aucun morceau n'est chargé, puis adaptée au morceau
const BLACK = new Set([1, 3, 6, 8, 10]);
const isBlack = m => BLACK.has(m % 12);
const whiteIdx = {}; let NW = 0;
function setRange(first, last) {
  FIRST = first; LAST = last; NW = 0;

setRange(21, 108);
function keyRect(m, W) {
  const ww = W / NW;
  if (!isBlack(m)) return { x: whiteIdx[m] * ww, w: ww, black: false };

  return { x: (whiteIdx[m - 1] + 1) * ww - bw / 2, w: bw, black: true };

const synthFallback = {

  ensure() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  play(midi, vel, dur) {
    this.ensure();

    g.gain.setTargetAtTime(0, t + dur, 0.07);

    if (i % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fillRect(0, yTop, W, yBot - yTop); }
    const beat = song.ppq * 4 / m.den;
    // barres de subdivision (1 par temps, hors début de mesure) : pointillés bien visibles, plus fines que les barres de mesure
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 1; ctx.setLineDash([7, 5]);
    for (let t = m.startTick + beat; t < m.startTick + m.lenTick - 1; t += beat) { const yy = Math.round(y(t)) + .5; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
    ctx.restore();
    if (m.startTick >= posTick) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(0, Math.round(yBot), W, 2); }
    // numéro (collé en bas si la mesure est en cours)
    const ly = Math.min(yBot, rollH - 4) - 6;
    ctx.font = '700 15px -apple-system, sans-serif'; ctx.textAlign = 'left';
    const label = m.label, tw = ctx.measureText(label).width;
    ctx.fillStyle = i === mi ? 'rgba(91,124,255,.95)' : 'rgba(40,48,86,.95)';
    rrect(6, ly - 15, tw + 14, 21, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(label, 13, ly);
  }

  // notes visibles
  const vis = [];
  for (let i = lowerBoundTick(posTick - song.maxDur); i < song.notes.length && song.notes[i].tick < topTick; i++) {
    const n = song.notes[i];
    if (n.tick + n.dur <= posTick) continue;
    vis.push(n);
    if (n.tick <= posTick) active.set(n.midi, n);
  }
  [false, true].forEach(blackPass => {
    vis.forEach(n => {
      const kr = keyRect(n.midi, W); if (kr.black !== blackPass) return;
      const c = COL[noteHand(n)], lit = n.tick <= posTick;
      const y1 = y(n.tick), y0 = Math.min(y(n.tick + n.dur), y1 - 5);
      const x = kr.x + 1, w = kr.w - 2, bottom = y1 - 1.5;
      ctx.save();
      if (lit) { ctx.shadowColor = c.note; ctx.shadowBlur = 16; }
      ctx.fillStyle = lit ? c.lit : (kr.black ? c.noteB : c.note);
      rrect(x, y0, w, bottom - y0, 5); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.45)'; rrect(x + .5, y0 + .5, w - 1, bottom - y0 - 1, 5); ctx.stroke();
      if (!kr.black && w >= 19 && bottom - y0 >= 15) {
        ctx.fillStyle = 'rgba(10,12,30,.85)'; ctx.font = '700 10px -apple-system, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(NOMS[n.midi % 12], x + w / 2, bottom - 4);
      }
    });
  });
  // doigtés (au-dessus de chaque note ; dans la note si elle touche le haut de la zone)
  // Empilement chronologique : les schémas se chevauchent quand les notes sont rapprochées. On dessine donc de la note la plus
  // lointaine à la plus proche : la prochaine à jouer est au premier plan, entièrement lisible ; les suivantes passent derrière
  // et sont de plus en plus estompées.
  for (let vi = vis.length - 1; vi >= 0; vi--) {
    const n = vis[vi];
    const kr = keyRect(n.midi, W), y1 = y(n.tick), y0 = Math.min(y(n.tick + n.dur), y1 - 5), x = kr.x + 1, w = kr.w - 2, bottom = y1 - 1.5;
    const rec = { n, x, w, top: y0, bottom };
    if (showFing && n.finger) {
      if (!fingIllus) { // doigté simple : « M.D. 1 »
        const label = handTxt(n) + ' ' + n.finger;
        ctx.font = '700 10px -apple-system, sans-serif'; ctx.textAlign = 'center';
        const pw = Math.ceil(ctx.measureText(label).width) + 8, ph = 14;
        const px = Math.max(2, Math.min(W - pw - 2, x + w / 2 - pw / 2));
        const py = y0 >= 18 ? y0 - ph - 3 : Math.max(2, bottom - ph - 3);
        ctx.fillStyle = 'rgba(8,10,24,.94)'; rrect(px, py, pw, ph, 7); ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = COL[noteHand(n)].note; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillText(label, px + pw / 2, py + 10.5);
        Object.assign(rec, { px, py, pw, ph });
      } else {
      const pw = Math.max(36, Math.min(76, kr.w * 1.9)), ph = (RAKE_BASE + 2) * pw / 122;
      const px = Math.max(1, Math.min(W - pw - 1, x + w / 2 - pw / 2));
      const py = y0 >= ph + 6 ? y0 - ph - 3 : Math.max(2, bottom - ph - 3);
      ctx.save(); ctx.globalAlpha = Math.max(0.5, 1 - Math.max(0, n.tick - posTick) / winT * 0.55);
      ctx.fillStyle = 'rgba(8,10,24,.96)'; rrect(px - 2, py - 2, pw + 4, ph + 4, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(120,134,196,.45)'; ctx.lineWidth = 1; ctx.stroke();
      drawMiniRake(noteHand(n), n.finger, px, py, pw);
      ctx.restore();
      Object.assign(rec, { px: px - 2, py: py - 2, pw: pw + 4, ph: ph + 4 });
      }
    }
    if (onScreen) { hit.push(rec); if (n === selNote || selGroup.has(n)) { ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; rrect(x - 1, y0 - 1, w + 2, bottom - y0 + 2, 6); ctx.stroke(); } }
  }
  if (onScreen && selRect) { // rectangle de sélection en cours
    ctx.fillStyle = 'rgba(91,124,255,.18)'; ctx.fillRect(selRect.x, selRect.y, selRect.w, selRect.h);
    ctx.save(); ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5; ctx.strokeStyle = '#9fb0ff'; ctx.strokeRect(selRect.x + .5, selRect.y + .5, selRect.w, selRect.h); ctx.restore();
  }
  ctx.restore();

  // ligne de jeu
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(0, rollH - 2, W, 2);
  drawKeyboard(W, rollH, kbH, active);
  if (fingIllus) drawBubbles(W, rollH, kbH, posTick, sp);
}

// Schémas des mains « râteaux » : une barre par doigt sur une ligne de base, pouces courts et séparés, mains opposées
// (main gauche à gauche, pouce à droite ; main droite à droite, pouce à gauche). Le doigt qui joue porte son numéro dans une
// pastille orange pleine ; celui qui va jouer (prochaine note de la main, dans les 2 noires à venir), dans une pastille orange évidée.
const RAKE = { 1: [9, .42], 2: [40, .92], 3: [58, 1], 4: [76, .92], 5: [94, .74] }; // doigt : [x, longueur relative] (main droite, repère 110 × 112)
const RAKE_LEN = 76, RAKE_BASE = 100, RAKE_COMB = [28, 104], ORANGE = '#ff9a2e';
const rkX = (side, x) => (side === 'L' ? 110 - x : x);
// Schéma miniature d'une main (même « râteau » que la bulle de saisie) : seul le doigt à utiliser est mis en évidence,
// avec son numéro dans une pastille orange. x, y = coin haut-gauche ; w = largeur ; renvoie la hauteur.
function drawMiniRake(side, finger, x, y, w, onLight) {
  const s = w / 122, X = u => x + (rkX(side, u) + 6) * s, Y = u => y + (u - 4) * s;
  const line = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = onLight ? '#3b4268' : '#7c88c4'; ctx.lineWidth = Math.max(1.4, 3.4 * s);
  line(X(RAKE_COMB[0]), Y(RAKE_BASE), X(RAKE_COMB[1]), Y(RAKE_BASE));
  line(X(RAKE[1][0] - 7), Y(RAKE_BASE), X(RAKE[1][0] + 7), Y(RAKE_BASE));
  for (let f = 1; f <= 5; f++) {
    const [bx, rel] = RAKE[f], y1 = RAKE_BASE - RAKE_LEN * rel, on = f === finger;
    ctx.strokeStyle = on ? ORANGE : (onLight ? '#4f5888' : '#a4aedc'); ctx.lineWidth = Math.max(on ? 2.8 : 2, (on ? 7 : 5.5) * s);
    line(X(bx), Y(RAKE_BASE), X(bx), Y(y1));
    if (on) {
      const r = Math.max(6.5, 19 * s);
      ctx.save(); ctx.shadowColor = ORANGE; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(X(bx), Y(y1), r, 0, Math.PI * 2);
      ctx.fillStyle = ORANGE; ctx.fill(); ctx.restore();
      ctx.lineWidth = 1.2; ctx.strokeStyle = '#10121f'; ctx.stroke();
      ctx.fillStyle = '#10121f'; ctx.font = '800 ' + Math.round(r * 1.3) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(f), X(bx), Y(y1) + 0.5);
    }
  }
  ctx.restore();
  return (RAKE_BASE + 2) * s;
}
// Bulles de doigté sur le clavier : elle apparaît (en grossissant) au moment où la note est jouée, centrée sur la touche, flotte
// tant que la note sonne (0,3 s au minimum), puis éclate (anneau + gouttelettes) quand elle est terminée.
const BUBBLE_MIN = 0.3, BUBBLE_POP = 0.15, BURST_SEC = 0.4; // secondes de temps de morceau
function drawBubbles(W, top, kbH, posTick, sp) {
  // remonter assez loin : une note déjà finie peut encore avoir sa bulle (durée minimale) puis son éclatement
  const back = posTick - song.timeline.secToTick(Math.max(0, sp - (BUBBLE_MIN + BURST_SEC)));
  for (let i = lowerBoundTick(posTick - song.maxDur - back); i < song.notes.length && song.notes[i].tick <= posTick; i++) {
    const n = song.notes[i]; if (!n.finger) continue;
    const endShow = Math.max(n.t1, n.t0 + BUBBLE_MIN), age = sp - n.t0, gone = sp - endShow;
    if (age < 0 || gone >= BURST_SEC || (gone >= 0 && !playing)) continue; // à l'arrêt, pas d'éclatement figé à mi-course
    const kr = keyRect(n.midi, W), D = Math.max(56, Math.min(100, kr.w * 1.7)), cx = kr.x + kr.w / 2;
    if (gone < 0) {
      const q = Math.min(1, age / BUBBLE_POP), e = 1 - Math.pow(1 - q, 3);
      const cy = top + kbH - D / 2 - 8 + Math.sin(sp * 4 + n.midi) * 2.2;
      drawBubble(cx, cy, D / 2 * (0.45 + 0.55 * e), noteHand(n), n.finger, e);
    } else drawBurst(cx, top + kbH - D / 2 - 8, D / 2, gone / BURST_SEC, noteHand(n), n.finger);
  }
}
function drawBubble(cx, cy, R, side, finger, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(cx - R * .3, cy - R * .35, R * .1, cx, cy, R);
  g.addColorStop(0, 'rgba(70,86,150,.92)'); g.addColorStop(1, 'rgba(14,18,44,.92)');
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(190,215,255,.9)'; ctx.stroke();
  const w = R * 1.4; drawMiniRake(side, finger, cx - w / 2, cy - (RAKE_BASE + 2) * w / 244, w);
  ctx.restore();
}
function drawBurst(cx, cy, R, p, side, finger) {
  const k = 1 - p;
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.pow(k, 2)); const w = R * 1.4; drawMiniRake(side, finger, cx - w / 2, cy - (RAKE_BASE + 2) * w / 244, w); // le schéma s'efface vite
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R * (1 + .7 * p), 0, Math.PI * 2); ctx.lineWidth = 1 + 3 * k; ctx.strokeStyle = 'rgba(190,215,255,' + (.9 * k).toFixed(3) + ')'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,' + (.25 * k * k).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(cx, cy, R * (1 + .7 * p), 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 10; i++) { // gouttelettes
    const a = i / 10 * Math.PI * 2 + .3, d = R * (.9 + 1.1 * p);
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, Math.max(.3, 4 * k), 0, Math.PI * 2);
    ctx.fillStyle = (i % 2 ? 'rgba(255,154,46,' : 'rgba(190,215,255,') + (.95 * k).toFixed(3) + ')'; ctx.fill();
  }
  ctx.restore();
}
// même schéma, en SVG cliquable, pour la bulle de saisie : cliquer sur un doigt (sa pastille ou sa barre) le choisit
function rakeSVG(side, cur) {
  const X = x => rkX(side, x);
  let g = '<svg viewBox="-6 0 122 112" width="168" height="154" role="group" aria-label="Choisir le doigt">';
  g += `<g stroke="#56629a" stroke-width="3" stroke-linecap="round"><line x1="${X(RAKE_COMB[0])}" y1="${RAKE_BASE}" x2="${X(RAKE_COMB[1])}" y2="${RAKE_BASE}"/><line x1="${X(RAKE[1][0] - 7)}" y1="${RAKE_BASE}" x2="${X(RAKE[1][0] + 7)}" y2="${RAKE_BASE}"/></g>`;
  for (let f = 1; f <= 5; f++) {
    const [x, rel] = RAKE[f], y1 = RAKE_BASE - RAKE_LEN * rel, on = f === cur;
    g += `<g class="fk" data-f="${f}"><rect x="${X(x) - 8}" y="${y1 - 12}" width="16" height="${RAKE_BASE - y1 + 12}" fill="transparent"/>` +
      `<line x1="${X(x)}" y1="${RAKE_BASE}" x2="${X(x)}" y2="${y1}" stroke="#8e9ad0" stroke-width="5" stroke-linecap="round"/>` +
      `<circle cx="${X(x)}" cy="${y1}" r="11" fill="${on ? ORANGE : '#1d2342'}" stroke="${on ? '#fff' : ORANGE}" stroke-width="2"/>` +
      `<text x="${X(x)}" y="${y1 + 4.5}" text-anchor="middle" font-size="13" font-weight="800" fill="${on ? '#10121f' : ORANGE}" font-family="-apple-system,sans-serif">${f}</text></g>`;
  }
  return g + '</svg>';
}
function drawKeyboard(W, top, kbH, active) {
  const ww = W / NW, bh = kbH * 0.62;
  ctx.fillStyle = '#05060d'; ctx.fillRect(0, top, W, kbH);
  for (let m = FIRST; m <= LAST; m++) {
    if (isBlack(m)) continue;
    const r = keyRect(m, W), an = active.get(m), hand = an && noteHand(an);
    const gr = ctx.createLinearGradient(0, top, 0, top + kbH);
    if (hand) { gr.addColorStop(0, COL[hand].key); gr.addColorStop(1, COL[hand].lit); } else { gr.addColorStop(0, '#f7f7f9'); gr.addColorStop(1, '#d9dbe3'); }
    ctx.fillStyle = gr; rrect(r.x + .5, top + 2, r.w - 1, kbH - 3, 3); ctx.fill();
    if (m % 12 === 0 && ww >= 17) {
      ctx.fillStyle = hand ? '#1b1b2a' : '#6a6f88'; ctx.font = '600 11px -apple-system, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Do' + (Math.floor(m / 12) - 1), r.x + r.w / 2, top + kbH - 9);
    }
    if (an && showFing && !fingIllus && an.finger && ww >= 14) { // doigté simple sur la touche : « M.D. » puis le chiffre
      ctx.fillStyle = '#10121f'; ctx.textAlign = 'center';
      ctx.font = '800 17px -apple-system, sans-serif'; ctx.fillText(String(an.finger), r.x + r.w / 2, top + kbH - 24);
      ctx.font = '700 9px -apple-system, sans-serif'; ctx.fillText(handTxt(an), r.x + r.w / 2, top + kbH - 40);
    }
  }
  for (let m = FIRST; m <= LAST; m++) {
    if (!isBlack(m)) continue;
    const r = keyRect(m, W), an = active.get(m), hand = an && noteHand(an);
    ctx.fillStyle = hand ? COL[hand].keyB : '#15161f';
    rrect(r.x, top + 2, r.w, bh, 3); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    if (an && showFing && !fingIllus && an.finger && r.w >= 9) { // doigté simple, touche noire : chiffre seul
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '800 13px -apple-system, sans-serif';
      ctx.fillText(String(an.finger), r.x + r.w / 2, top + bh - 6);
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(0, top, W, 2);
}

// ---------- Export vidéo (enregistrement en temps réel : image + son) ----------
const exp = { active: false, started: false, rec: null, chunks: [], canvas: null, ctx: null, W: 1280, H: 720, scale: 1, endAt: 0, cleanup: null, cancelled: false, mime: '' };
function pickMime() {
  if (!window.MediaRecorder) return '';
  return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
}
async function startExport() {
  if (!song || exp.active) return;
  clearError();
  if (speed <= 0) return showError('Export impossible à la vitesse 0.');
  const mime = pickMime(); if (!mime) return showError('Ce navigateur ne sait pas enregistrer de vidéo (essayez Chrome).');
  if (sampler && !samplerReady) return showError('Attendez la fin du chargement du piano avant d\'exporter.');
  pause(); seek(0);
  try { if (typeof Tone !== 'undefined') await Tone.start(); } catch (e) {}
  let audioStream;
  if (sampler && samplerReady) {
    const d = Tone.getContext().createMediaStreamDestination(); Tone.getDestination().connect(d);
    audioStream = d.stream; exp.cleanup = () => { try { Tone.getDestination().disconnect(d); } catch (e) {} };
  } else {
    synthFallback.ensure(); const d = synthFallback.ctx.createMediaStreamDestination(); synthFallback.tap = d;
    audioStream = d.stream; exp.cleanup = () => { synthFallback.tap = null; };
  }
  const outW = parseInt($('xres').value, 10);
  exp.W = 1280; exp.H = 720; exp.scale = outW / 1280;
  exp.canvas = document.createElement('canvas'); exp.canvas.width = outW; exp.canvas.height = Math.round((720 + BAND) * exp.scale);
  exp.ctx = exp.canvas.getContext('2d');
  exp.mime = mime; exp.chunks = []; exp.cancelled = false; exp.started = false; exp.active = true;
  draw(); // 1re image avant le début de la capture
  const stream = new MediaStream([...exp.canvas.captureStream(30).getVideoTracks(), ...audioStream.getAudioTracks()]);
  exp.rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: outW >= 1920 ? 12e6 : 6e6 });
  exp.rec.ondataavailable = e => { if (e.data && e.data.size) exp.chunks.push(e.data); };
  exp.rec.onstop = finishExport;
  exp.rec.start(1000);
  refreshButtons();
  await play(); exp.started = true;
}
function exportTick(ts) {
  const pct = song.durationSec ? Math.min(100, Math.round(100 * pos / song.durationSec)) : 100;
  $('status').dataset.exp = 'Export vidéo en cours… ' + pct + ' % (gardez cet onglet visible)'; refreshStatus();
  if (!playing) { // fin du morceau : on laisse décroître la dernière note
    if (!exp.endAt) exp.endAt = ts + 1800;
    else if (ts >= exp.endAt) stopExport(false);
  }
}
function stopExport(cancel) {
  if (!exp.active || !exp.rec || exp.rec.state === 'inactive') return;
  exp.cancelled = cancel; pause(); exp.rec.stop();
}
function finishExport() {
  const type = exp.mime.split(';')[0], ext = type === 'video/mp4' ? 'mp4' : 'webm';
  if (exp.cleanup) exp.cleanup();
  const wasCancelled = exp.cancelled, chunks = exp.chunks;
  exp.active = false; exp.started = false; exp.endAt = 0; exp.rec = null; exp.chunks = [];
  delete $('status').dataset.exp;
  seek(0); refreshButtons();
  if (wasCancelled) { refreshStatus(); return; }
  const blob = new Blob(chunks, { type }), name = (song.title || 'piano-roll').replace(/[\\/:*?"<>|]+/g, '_') + '.' + ext;
  stats.lastExport = { size: blob.size, type, name, blob };
  if (!window.__noDownload) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  $('status').dataset.exp = 'Vidéo enregistrée : ' + name + ' (' + (blob.size / 1048576).toFixed(1) + ' Mo)'; refreshStatus();
  setTimeout(() => { delete $('status').dataset.exp; refreshStatus(); }, 8000);
}
$('export').onclick = () => (exp.active ? stopExport(true) : startExport());

// ---------- Boucle ----------
function frame(ts) {
  const dt = Math.min(0.25, (ts - lastTs) / 1000); lastTs = ts;
  { const target = (playing && !exp.active) ? audioLatency() + syncMs / 1000 : 0; vlag += (target - vlag) * Math.min(1, dt * 10); }
  if (playing && song) {
    pos += dt * speed;
    while (speed > 0 && nextIdx < song.notes.length && song.notes[nextIdx].t0 <= pos) playNote(song.notes[nextIdx++]);
    const END = song.durationSec + BUBBLE_MIN + BURST_SEC; // on laisse finir la dernière bulle (sinon elle reste figée au début de son éclatement)
    if (pos >= END) { pos = END; playing = false; refreshButtons(); }
  }
  if (exp.active && exp.started) exportTick(ts);
  draw();
  requestAnimationFrame(frame);
}

// ---------- Démarrage ----------
setSpeed(1); refreshFingButton(); refreshButtons(); initSampler();
requestAnimationFrame(ts => { lastTs = ts; frame(ts); });
// accès pour les tests automatiques
window.__app = { stats, get song() { return song; }, get pos() { return pos; }, get playing() { return playing; }, get speed() { return speed; } };
</script>
</body>
</html>
