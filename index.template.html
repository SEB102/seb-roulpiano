<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEB-ROULPIANO</title>
<style>
  :root { --bg:#0e1120; --panel:#171b30; --line:#2a3050; --text:#e8ebf7; --muted:#8d94b3;
          --R:#ff9a2e; --L:#3b9cff; --accent:#5b7cff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
              font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:8px 12px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
  .grp { display:flex; align-items:center; gap:8px; }
  button, .btn { background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 13px;
                 font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover, .btn:hover { background:#2f3760; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#6f8bff; }
  input[type=file] { display:none; }
  input[type=range] { accent-color:var(--accent); }
  input[type=number] { width:4.8em; background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; font-variant-numeric:tabular-nums; }
  select { background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; }
  label { color:var(--muted); }
  #speed { width:190px; }
  #speedVal { display:inline-block; min-width:3.4em; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  .legend { color:var(--muted); font-size:13px; }
  #title { font-weight:600; max-width:34ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #status { color:var(--muted); font-size:13px; margin-left:auto; }
  #status.err { color:#ff7b7b; }
  #progress { flex:1; min-width:160px; }
  #info { color:var(--muted); font-variant-numeric:tabular-nums; min-width:21ch; text-align:right; }
  .tip { position:relative; }
  .tiptext { display:none; position:absolute; top:calc(100% + 8px); left:0; width:max-content; max-width:min(520px, 90vw); z-index:20;
             background:#0b0e1c; color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:8px 12px; font-size:13px; line-height:1.4;
             box-shadow:0 6px 20px rgba(0,0,0,.5); pointer-events:none; }
  .tip:hover .tiptext, .tip:focus-within .tiptext { display:block; }
  footer { background:var(--panel); border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:12px; letter-spacing:.12em; padding:6px 12px; }
  main { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #fpop { position:absolute; z-index:6; display:none; align-items:center; gap:5px; background:#0b0e1c; border:1px solid var(--accent); border-radius:10px; padding:6px 8px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #fpop .sep { width:1px; align-self:stretch; background:var(--line); margin:0 3px; }
  #fpop button { padding:4px 10px; min-width:30px; }
  #fpop button.on { background:var(--accent); border-color:var(--accent); font-weight:700; }
  button.pressed { background:var(--accent); border-color:var(--accent); }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(91,124,255,.25);
          border:3px dashed var(--accent); font-size:22px; z-index:5; pointer-events:none; }
  body.dragging #drop { display:flex; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="core.js"></script>
</head>
<body>
<header>
  <div class="row">
    <label class="btn" for="file">📂 Ouvrir un fichier…</label>
    <input id="file" type="file" accept=".mid,.midi,.musicxml,.xml,.mxl">
    <button id="demo" title="Charger le morceau d'exemple intégré">Exemple</button>
    <div class="grp tip">
      <button id="export">🎬 Export vidéo</button>
      <select id="xres" title="Résolution de la vidéo"><option value="1280">720p</option><option value="1920">1080p</option></select>
      <span class="tiptext" role="tooltip">Garder l'onglet visible pendant l'export, sinon le navigateur ralentit l'enregistrement. L'export est impossible à la vitesse 0.</span>
    </div>
    <div class="grp">
      <button id="rew" title="Retour au début (Début)">⏮ Début</button>
      <button id="play" class="primary" title="Lecture (Espace)">▶ Lecture</button>
      <button id="stop" title="Pause : arrête à la position courante (Espace)">⏸ Pause</button>
    </div>
    <div class="grp">
      <label for="speed">Vitesse</label>
      <input id="speed" title="Vitesse de lecture (0 à 3)" type="range" min="0" max="3" step="0.05" value="1">
      <span id="speedVal">×1,00</span>
      <button id="speed1" title="Remettre la vitesse à 1">1×</button>
    </div>
    <div class="grp">
      <label for="tempo">Tempo ♩ =</label>
      <input id="tempo" type="number" min="20" max="300" step="1" disabled title="Tempo de départ (noires par minute). Par défaut : celui du fichier ; modifiable.">
      <button id="tempoReset" title="Revenir au tempo du fichier">↺</button>
    </div>
    <div class="grp">
      <button id="fing" title="Afficher / masquer les doigtés. Pour en saisir un : cliquer sur une note puis choisir 1 à 5.">🖐 Doigtés</button>
      <button id="fingExp" title="Exporter les doigtés de ce morceau dans un fichier">⤓</button>
      <button id="fingImp" title="Importer des doigtés depuis un fichier (remplace les actuels)">⤒</button>
      <input id="fingFile" type="file" accept=".json,application/json">
    </div>
    <div class="grp">
      <label for="sync">Synchro</label>
      <input id="sync" type="number" min="-300" max="1000" step="10" value="0" title="Décalage son/image en millisecondes. Le navigateur compense déjà la latence audio ; si le son vous semble encore en retard sur l'image, augmentez cette valeur (l'image est retardée) ; s'il est en avance, diminuez-la.">
      <span class="legend">ms</span>
    </div>
    <div class="grp">
      <label for="vis">Mesures visibles</label>
      <select id="vis"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
    </div>
    <span class="legend" title="La couleur suit la main du doigté : par défaut clé de sol = main droite, clé de fa = main gauche ; modifiable note par note"><span class="sw" style="background:var(--R)"></span>M.D. (clé de sol)
      <span class="sw" style="background:var(--L);margin-left:10px"></span>M.G. (clé de fa)</span>
  </div>
  <div class="row">
    <span id="title">Aucun morceau</span>
    <input id="progress" title="Position dans le morceau" type="range" min="0" max="1" step="0.001" value="0" disabled>
    <span id="info">—</span>
    <span id="status"></span>
  </div>
</header>
<main>
  <canvas id="cv"></canvas>
  <div id="fpop"><button data-h="R" title="Main droite (touche D)">M.D.</button><button data-h="L" title="Main gauche (touche G)">M.G.</button><span class="sep"></span><button data-f="1">1</button><button data-f="2">2</button><button data-f="3">3</button><button data-f="4">4</button><button data-f="5">5</button><button data-f="0" title="Effacer le doigté">✕</button></div>
  <div id="drop">Déposez un fichier .mid / .musicxml / .mxl</div>
</main>
<footer>SEB-ROULPIANO · Octobre 2026</footer>

<script>
'use strict';
const EXEMPLE_B64 = '__EXEMPLE_B64__';
const $ = id => document.getElementById(id);
const cv = $('cv'); let ctx = cv.getContext('2d'); const screenCtx = ctx;

// ---------- État ----------
let vlag = 0; // retard (s, temps réel) appliqué à l'image pour la caler sur le son réellement entendu
let song = null, pos = 0, playing = false, speed = 1, visMeasures = 2, nextIdx = 0, lastTs = 0, seeking = false;

// ---------- Clavier 88 touches ----------
let FIRST = 21, LAST = 108; // étendue affichée : tout le piano tant qu'aucun morceau n'est chargé, puis adaptée au morceau
const BLACK = new Set([1, 3, 6, 8, 10]);
const isBlack = m => BLACK.has(m % 12);
const whiteIdx = {}; let NW = 0;
function setRange(first, last) {
  FIRST = first; LAST = last; NW = 0;
  for (const k in whiteIdx) delete whiteIdx[k];
  for (let m = FIRST; m <= LAST; m++) if (!isBlack(m)) whiteIdx[m] = NW++;
}
setRange(21, 108);
function keyRect(m, W) {
  const ww = W / NW;
  if (!isBlack(m)) return { x: whiteIdx[m] * ww, w: ww, black: false };
  const bw = ww * 0.6;
  return { x: (whiteIdx[m - 1] + 1) * ww - bw / 2, w: bw, black: true };
}
const NOMS = ['Do', 'Do♯', 'Ré', 'Ré♯', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'La♯', 'Si'];

// ---------- Couleurs : main droite (M.D.) = orange, main gauche (M.G.) = bleu ; la main est celle du doigté (par défaut : clé de sol = M.D., clé de fa = M.G.) ----------
const COL = {
  R: { note: '#ff9a2e', noteB: '#d9690a', lit: '#ffd08a', key: '#ffb04d', keyB: '#ff8a1f' },
  L: { note: '#3b9cff', noteB: '#1f66c9', lit: '#a9d3ff', key: '#6bb2ff', keyB: '#3b86ee' },
};

// ---------- Son ----------
const synthFallback = {
  ctx: null, voices: new Set(),
  tap: null,
  ensure() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  play(midi, vel, dur) {
    this.ensure();
    const c = this.ctx, t = c.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12), v = 0.25 * vel / 127;
    const g = c.createGain(); g.connect(c.destination); if (this.tap) g.connect(this.tap);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.005);
    g.gain.setTargetAtTime(v * 0.05, t + 0.01, 0.9);
    g.gain.setTargetAtTime(0, t + dur, 0.07);
    const o1 = c.createOscillator(), o2 = c.createOscillator(), g2 = c.createGain();
    o1.type = 'triangle'; o1.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = 0.35;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(t); o2.start(t); o1.stop(t + dur + 1); o2.stop(t + dur + 1);
    const voice = { o1, o2, g }; this.voices.add(voice); o1.onended = () => this.voices.delete(voice);
  },
  releaseAll() { this.voices.forEach(v => { try { v.g.gain.cancelScheduledValues(0); v.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.03); v.o1.stop(this.ctx.currentTime + 0.2); v.o2.stop(this.ctx.currentTime + 0.2); } catch (e) {} }); this.voices.clear(); },
};
let sampler = null, samplerReady = false;
const stats = { played: 0 };
function setSoundStatus(t) { $('status').dataset.snd = t; refreshStatus(); }
function initSampler() {
  if (typeof Tone === 'undefined') { setSoundStatus('Piano : synthé de secours (Tone.js indisponible)'); return; }
  const urls = { A0: 'A0.mp3', C8: 'C8.mp3' }; // échantillons Salamander : un tous les 3 demi-tons
  for (let o = 1; o <= 7; o++) ['C', 'D#', 'F#', 'A'].forEach(n => { urls[n + o] = n.replace('#', 's') + o + '.mp3'; });
  try { Tone.context.lookAhead = 0; } catch (e) {} // sinon Tone.now() retarde chaque note de 100 ms
  setSoundStatus('Piano : chargement des échantillons…');
  sampler = new Tone.Sampler({
    urls, release: 1, baseUrl: 'https://tonejs.github.io/audio/salamander/',
    onload: () => { samplerReady = true; setSoundStatus(''); },
    onerror: () => { sampler = null; setSoundStatus('Piano : synthé de secours (échantillons indisponibles)'); },
  }).toDestination();
}
// Latence audio : tampon du navigateur + sortie matérielle (haut-parleurs, Bluetooth…) + réglage manuel « Synchro ».
let syncMs = 0;
try { const v = parseInt(localStorage.getItem('seb-roulpiano-sync'), 10); if (isFinite(v)) syncMs = Math.max(-300, Math.min(1000, v)); } catch (e) {}
function audioLatency() {
  try {
    const c = (typeof Tone !== 'undefined' && Tone.context) ? Tone.context.rawContext : synthFallback.ctx;
    return c ? (c.baseLatency || 0) + (c.outputLatency || 0) : 0;
  } catch (e) { return 0; }
}
function playNote(n) {
  stats.played++;
  const dur = Math.min(60, Math.max(0.06, (n.t1 - n.t0) / speed)); // vitesse 0 : jamais appelée (cf. frame)
  if (samplerReady && sampler) sampler.triggerAttackRelease(Tone.Frequency(n.midi, 'midi').toNote(), dur, Tone.now(), n.vel / 127);
  else synthFallback.play(n.midi, n.vel, dur);
}
function releaseAll() { try { if (sampler && samplerReady) sampler.releaseAll(Tone.now()); } catch (e) {} synthFallback.releaseAll(); }

// ---------- Utilitaires temps ----------
function lowerBoundTick(tick) { // 1er indice dont n.tick >= tick
  const a = song.notes; let lo = 0, hi = a.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (a[m].tick < tick) lo = m + 1; else hi = m; }
  return lo;
}
function lowerBoundSec(sec) {
  const a = song.notes; let lo = 0, hi = a.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (a[m].t0 < sec) lo = m + 1; else hi = m; }
  return lo;
}
function measureIndexAt(tick) {
  const a = song.measures; let lo = 0, hi = a.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (a[m].startTick <= tick) lo = m; else hi = m - 1; }
  return lo;
}
const fmt = s => { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };

// ---------- Contrôles ----------
async function play() {
  if (!song || playing) return;
  if (pos >= song.durationSec - 0.01) pos = 0;
  try { if (typeof Tone !== 'undefined') await Tone.start(); } catch (e) {}
  nextIdx = lowerBoundSec(pos - 1e-6);
  hideFpop(); lastTs = performance.now(); playing = true; refreshButtons();
}
function pause() { if (!playing) return; playing = false; releaseAll(); refreshButtons(); }
function seek(sec) {
  if (!song) return;
  pos = Math.min(Math.max(0, sec), song.durationSec); hideFpop();
  releaseAll(); nextIdx = lowerBoundSec(pos - 1e-6);
}
function rewind() { pause(); seek(0); }
function seekMeasures(d) {
  if (!song) return;
  const i = measureIndexAt(song.timeline.secToTick(pos));
  const j = Math.min(Math.max(0, i + d), song.measures.length - 1);
  seek(song.timeline.tickToSec(song.measures[j].startTick));
}
function setSpeed(v) {
  speed = Math.min(3, Math.max(0, Math.round(v * 100) / 100));
  $('speed').value = speed; $('speedVal').textContent = '×' + speed.toFixed(2).replace('.', ',');
}
function refreshButtons() {
  const x = exp.active;
  $('play').disabled = !song || playing || x; $('stop').disabled = !playing || x; $('rew').disabled = !song || x;
  $('progress').disabled = !song || x; $('speed').disabled = x; $('speed1').disabled = x; $('demo').disabled = x;
  $('file').disabled = x; $('export').disabled = !song; $('xres').disabled = x;
  $('fing').disabled = !song; $('fingExp').disabled = !song; $('fingImp').disabled = !song || x;
  $('tempo').disabled = !song || x; $('tempoReset').disabled = !song || x;
  $('export').textContent = x ? '⏹ Annuler l\'export' : '🎬 Export vidéo';
}
function refreshStatus() {
  const s = $('status'); const err = s.dataset.err;
  s.textContent = err || s.dataset.exp || s.dataset.snd || ''; s.classList.toggle('err', !!err);
}
function showError(msg) { $('status').dataset.err = msg; refreshStatus(); }
function clearError() { delete $('status').dataset.err; refreshStatus(); }

$('play').onclick = play; $('stop').onclick = pause; $('rew').onclick = rewind;
$('speed').oninput = e => setSpeed(parseFloat(e.target.value));
$('speed1').onclick = () => setSpeed(1);
// ---------- Doigtés ----------
// Source : doigtés inscrits dans le MusicXML (n.fileFinger) + saisie manuelle (song.manual, mémorisée par morceau dans le navigateur).
let showFing = true, selNote = null; const hit = [];
try { const v = localStorage.getItem('seb-roulpiano-doigtes-affiches'); if (v !== null) showFing = v === '1'; } catch (e) {}
const noteKey = n => n.tick + ':' + n.midi;
const noteHand = n => n.fh || n.hand; // main du doigté : par défaut la clé (sol = droite, fa = gauche), modifiable note par note
const handTxt = n => (noteHand(n) === 'L' ? 'M.G.' : 'M.D.');
const storeKey = () => 'seb-roulpiano-doigtes:' + song.title + '|' + song.notes.length + '|' + song.endTick;
function loadFingerings() {
  song.manual = { f: {}, h: {} }; // f : doigts saisis (0 = effacé), h : main du doigté si différente de la clé
  try {
    const raw = JSON.parse(localStorage.getItem(storeKey()) || 'null');
    if (raw) song.manual = (raw.f || raw.h) ? { f: raw.f || {}, h: raw.h || {} } : { f: raw, h: {} }; // ancien format : doigts seuls
  } catch (e) {}
  song.notes.forEach(n => {
    n.fileFinger = n.finger || 0; const m = song.manual.f[noteKey(n)]; n.finger = m !== undefined ? m : n.fileFinger;
    const h = song.manual.h[noteKey(n)]; n.fh = h === 'L' || h === 'R' ? h : undefined;
  });
}
function saveManual() { try { localStorage.setItem(storeKey(), JSON.stringify(song.manual)); } catch (e) {} }
function setFinger(n, f) {
  n.finger = f;
  if (f === n.fileFinger) delete song.manual.f[noteKey(n)]; else song.manual.f[noteKey(n)] = f;
  saveManual();
}
function setHand(n, h) {
  n.fh = h === n.hand ? undefined : h;
  if (n.fh) song.manual.h[noteKey(n)] = n.fh; else delete song.manual.h[noteKey(n)];
  saveManual();
}
function refreshFingButton() { $('fing').textContent = showFing ? '🖐 Masquer les doigtés' : '🖐 Afficher les doigtés'; $('fing').classList.toggle('pressed', showFing); }
function markFpop() {
  const n = selNote, p = $('fpop');
  // ordre des doigts : main droite 1→5, main gauche 5→1 (comme les doigts sur le clavier, de gauche à droite)
  const clear = p.querySelector('button[data-f="0"]'), fs = [...p.querySelectorAll('button[data-f]')].filter(b => b.dataset.f !== '0');
  fs.sort((a, b) => (noteHand(n) === 'L' ? b.dataset.f - a.dataset.f : a.dataset.f - b.dataset.f)).forEach(b => p.insertBefore(b, clear));
  p.querySelectorAll('button[data-f]').forEach(b => b.classList.toggle('on', parseInt(b.dataset.f, 10) === (n.finger || 0) && b.dataset.f !== '0'));
  p.querySelectorAll('button[data-h]').forEach(b => b.classList.toggle('on', b.dataset.h === noteHand(n)));
}
function chooseHand(h) { if (!selNote) return; setHand(selNote, h); markFpop(); }
function hideFpop() { selNote = null; $('fpop').style.display = 'none'; }
function showFpop(h) {
  const p = $('fpop'); selNote = h.n;
  markFpop();
  p.style.display = 'flex';
  const pw = p.offsetWidth, ph = p.offsetHeight;
  p.style.left = Math.max(4, Math.min(cssW - pw - 4, h.x + h.w / 2 - pw / 2)) + 'px';
  p.style.top = Math.max(4, Math.min(cssH - ph - 4, h.top - ph - 8)) + 'px';
}
function chooseFinger(f) {
  if (!selNote) return;
  setFinger(selNote, f);
  if (f && !showFing) { showFing = true; refreshFingButton(); try { localStorage.setItem('seb-roulpiano-doigtes-affiches', '1'); } catch (e) {} }
  hideFpop();
}
$('fpop').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]'); if (b) return chooseFinger(parseInt(b.dataset.f, 10));
  const h = e.target.closest('button[data-h]'); if (h) chooseHand(h.dataset.h);
});
$('fing').onclick = () => { showFing = !showFing; refreshFingButton(); try { localStorage.setItem('seb-roulpiano-doigtes-affiches', showFing ? '1' : '0'); } catch (e) {} };
cv.addEventListener('click', e => {
  if (!song || exp.active) return;
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * cssW / r.width, py = (e.clientY - r.top) * cssH / r.height;
  for (let i = hit.length - 1; i >= 0; i--) {
    const h = hit[i];
    if ((px >= h.x && px <= h.x + h.w && py >= h.top && py <= h.bottom) || (h.pw && px >= h.px && px <= h.px + h.pw && py >= h.py && py <= h.py + h.ph)) {
      pause(); showFpop(h); return;
    }
  }
  hideFpop();
});
$('fingExp').onclick = () => {
  const fingerings = {}, mains = {};
  song.notes.forEach(n => { if (n.finger) fingerings[noteKey(n)] = n.finger; if (n.fh) mains[noteKey(n)] = n.fh; });
  const blob = new Blob([JSON.stringify({ version: 2, titre: song.title, doigtes: fingerings, mains }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (song.title || 'morceau').replace(/[\\/:*?"<>|]+/g, '_') + '.doigtes.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
};
$('fingImp').onclick = () => $('fingFile').click();
$('fingFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !song) return;
  try {
    const obj = JSON.parse(await f.text()); const d = obj && obj.doigtes;
    if (!d || typeof d !== 'object') throw new Error('Fichier de doigtés invalide.');
    hideFpop(); song.manual = { f: {}, h: {} }; const mh = (obj.mains && typeof obj.mains === 'object') ? obj.mains : {};
    song.notes.forEach(n => {

// ---------- Tempo de départ ----------
const fmtBpm = b => String(Math.round(b * 10) / 10);

  const posTick = song.timeline.secToTick(pos);

  pos = Math.min(song.durationSec, song.timeline.tickToSec(posTick));

}
$('tempo').onchange = e => { const v = parseFloat(String(e.target.value).replace(',', '.')); if (isFinite(v) && v > 0) applyTempo(v); else if (song) e.target.value = fmtBpm(song.timeline.bpmAtTick(0)); };
$('tempoReset').onclick = () => { if (song) applyTempo(song.fileBpm); };
$('sync').value = syncMs;
$('sync').onchange = e => { const v = parseInt(e.target.value, 10); syncMs = isFinite(v) ? Math.max(-300, Math.min(1000, v)) : 0; e.target.value = syncMs; try { localStorage.setItem('seb-roulpiano-sync', String(syncMs)); } catch (er) {} };

$('progress').onchange = () => { seeking = false; };
addEventListener('keydown', e => {
  if (selNote && !(e.target.tagName === 'INPUT' && e.target.type === 'number')) {
    if (/^[1-5]$/.test(e.key)) { e.preventDefault(); chooseFinger(parseInt(e.key, 10)); return; }
    if (e.key === '0' || e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); chooseFinger(0); return; }
    if (e.key === 'd' || e.key === 'D') { e.preventDefault(); chooseHand('R'); return; }
    if (e.key === 'g' || e.key === 'G') { e.preventDefault(); chooseHand('L'); return; }

  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.code === 'Home') { e.preventDefault(); rewind(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); seekMeasures(-1); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); seekMeasures(1); }
  else if (e.code === 'ArrowUp' && e.target.type !== 'range') { e.preventDefault(); setSpeed(speed + 0.05); }
  else if (e.code === 'ArrowDown' && e.target.type !== 'range') { e.preventDefault(); setSpeed(speed - 0.05); }

// ---------- Chargement de fichiers ----------
async function openBuffer(name, buf) {
  try {
    const s = await PianoCore.loadSong(name, new Uint8Array(buf));
    pause(); song = s; pos = 0; nextIdx = 0; clearError(); $('tempo').value = fmtBpm(s.fileBpm); hideFpop(); loadFingerings(); { const r = PianoCore.keyboardRange(s.lo, s.hi); setRange(r.first, r.last); }
    $('title').textContent = s.title; $('title').title = s.title;
    const modes = { 'pistes': 'sol/fa = 2 pistes', 'portées': 'sol/fa = 2 portées', 'parties': 'sol/fa = 2 parties', 'do-central': 'sol/fa = coupure au Do central' };
    setSoundStatusExtra(modes[s.handMode] || '');

  } catch (err) { showError(err.message || String(err)); }
}
function setSoundStatusExtra() {} // l'info « sol/fa = … » n'est plus affichée
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  await openBuffer(f.name, await f.arrayBuffer()); e.target.value = '';
};
$('demo').onclick = () => {
  const bin = atob(EXEMPLE_B64); const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  openBuffer('Lettre à Élise (exemple)', b.buffer);
};
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0]; if (f) await openBuffer(f.name, await f.arrayBuffer());
});

// ---------- Dessin ----------
let cssW = 0, cssH = 0, dpr = 1;
function fitCanvas() {

function rrect(x, y, w, h, r) {

function draw() {

}
// petit bandeau sous l'image de la vidéo (hors zone de jeu)
const BAND = 24;
function drawBand(c, W, H, k) {

  c.fillStyle = '#171b30'; c.fillRect(0, H, W, BAND);
  c.fillStyle = '#2a3050'; c.fillRect(0, H, W, 1);
  c.fillStyle = '#8d94b3'; c.font = '12px -apple-system, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  if ('letterSpacing' in c) c.letterSpacing = '1.5px';
  c.fillText('SEB-ROULPIANO · Octobre 2026', W / 2, H + BAND / 2 + 1);
  if ('letterSpacing' in c) c.letterSpacing = '0px';
  c.textBaseline = 'alphabetic';
}
function updateInfo() {
  if (!song) return;
  const posTick = song.timeline.secToTick(pos), M = song.measures[measureIndexAt(posTick)];
  const bpm = song.timeline.bpmAtTick(posTick) * speed;
  $('info').textContent = 'Mesure ' + M.label + ' / ' + song.measures[song.measures.length - 1].label + '  ·  ♩=' + Math.round(bpm) + '  ·  ' + fmt(pos) + ' / ' + fmt(song.durationSec);
  if (!seeking) $('progress').value = song.durationSec ? pos / song.durationSec : 0;
}
// dessine la scène dans le contexte c (écran ou canvas d'export) ; W,H en pixels logiques, k = facteur d'échelle
function renderScene(c, W, H, k) {
  const prev = ctx; ctx = c;

}

    if (isBlack(m)) continue;

    ctx.fillStyle = m % 12 === 0 ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.035)';

    const m = song.measures[i], yTop = y(m.startTick + m.lenTick), yBot = y(m.startTick);

    ctx.restore();

  const hr = [];
  vis.forEach(n => {
    const kr = keyRect(n.midi, W), y1 = y(n.tick), y0 = Math.min(y(n.tick + n.dur), y1 - 5), x = kr.x + 1, w = kr.w - 2, bottom = y1 - 1.5;
    const rec = { n, x, w, top: y0, bottom };
    if (showFing && n.finger) {
      const label = handTxt(n) + ' ' + n.finger;
      ctx.font = '700 10px -apple-system, sans-serif'; ctx.textAlign = 'center';
      const pw = Math.ceil(ctx.measureText(label).width) + 8, ph = 14;

      ctx.fillStyle = 'rgba(8,10,24,.94)'; rrect(px, py, pw, ph, 7); ctx.fill();
      ctx.lineWidth = 1.2; ctx.strokeStyle = COL[noteHand(n)].note; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillText(label, px + pw / 2, py + 10.5);
      Object.assign(rec, { px, py, pw, ph });
    }
    if (onScreen) { hit.push(rec); if (n === selNote) { ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; rrect(x - 1, y0 - 1, w + 2, bottom - y0 + 2, 6); ctx.stroke(); } }
  });

function drawKeyboard(W, top, kbH, active) {
  const ww = W / NW, bh = kbH * 0.62;
  ctx.fillStyle = '#05060d'; ctx.fillRect(0, top, W, kbH);

    }

      ctx.font = '800 17px -apple-system, sans-serif'; ctx.fillText(String(an.finger), r.x + r.w / 2, top + kbH - 24);
      if (kbH >= 100) { ctx.font = '700 9px -apple-system, sans-serif'; ctx.fillText(handTxt(an), r.x + r.w / 2, top + kbH - 40); }
    }
  }

// ---------- Export vidéo (enregistrement en temps réel : image + son) ----------
const exp = { active: false, started: false, rec: null, chunks: [], canvas: null, ctx: null, W: 1280, H: 720, scale: 1, endAt: 0, cleanup: null, cancelled: false, mime: '' };

async function startExport() {

  const mime = pickMime(); if (!mime) return showError('Ce navigateur ne sait pas enregistrer de vidéo (essayez Chrome).');

  } else {

function exportTick(ts) {

}

$('export').onclick = () => (exp.active ? stopExport(true) : startExport());

// ---------- Boucle ----------
function frame(ts) {

  if (playing && song) {

    while (speed > 0 && nextIdx < song.notes.length && song.notes[nextIdx].t0 <= pos) playNote(song.notes[nextIdx++]);

// ---------- Démarrage ----------
setSpeed(1); refreshFingButton(); refreshButtons(); initSampler();
requestAnimationFrame(ts => { lastTs = ts; frame(ts); });

window.__app = { stats, get song() { return song; }, get pos() { return pos; }, get playing() { return playing; }, get speed() { return speed; } };
